name: Build Android APK

on:
  workflow_dispatch:

env:
  CI: "true"

jobs:
  android:
    name: Android (signed APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-apk

      - run: pnpm install --frozen-lockfile
      - name: Generate Android project
        run: pnpm tauri android init --ci
      - name: Build APK (split per ABI)
        run: pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64

      - name: Sign APK with in-run keystore
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/hghub-release.keystore"
          keytool -genkeypair -v -keystore "$KS" -alias hghub \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass hghub123 -keypass hghub123 \
            -dname "CN=HGhub, OU=Personal, O=Personal, L=NA, S=NA, C=CN"
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          mkdir -p artifacts
          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk'); do
            name="$(basename "$f")"
            "$APKSIGNER" sign --ks "$KS" --ks-key-alias hghub \
              --ks-pass pass:hghub123 --key-pass pass:hghub123 \
              --v4-signing-enabled false --out "artifacts/$name" "$f"
            found=$((found+1))
          done
          if [ "$found" -eq 0 ]; then echo "::error::No APK found"; exit 1; fi
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/*
          if-no-files-found: error